name: profil frissítése

# Miért éjszaka? Mert a hozzájárulási naptár egész UTC-napokkal dolgozik, és
# 03:17 UTC-kor az előző nap már biztosan lezárult. A "furcsa" perc szándékos:
# a GitHub az egész órára ütemezett futásokat torlódás esetén elhalasztja.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:          # kézzel is indítható, az Actions fülön
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # a generált fájlok visszaírásához

concurrency:
  group: profil-frissites
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Nincs `pip install` lépés. Mindkét szkript csak a szabványos
      # könyvtárat használja, a betűtípus pedig előre kiszedve, base64-ként
      # verziókövetve van. Így a futásnak nincs mitől eltörnie.

      - name: statisztika lekérése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: SVG-k rajzolása
        run: python scripts/render_svgs.py

      - name: commit, ha tényleg változott valami
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          # A --quiet nullát ad, ha nincs eltérés. Enélkül minden éjjel
          # keletkezne egy üres commit, és az előzmény olvashatatlan lenne.
          if git diff --cached --quiet; then
            echo "nincs változás, nincs commit"
          else
            git commit -m "profil: statisztika frissítve ($(date -u +%Y-%m-%d))"
            git push
          fi
